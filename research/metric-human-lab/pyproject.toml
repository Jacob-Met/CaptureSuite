[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metric-human-lab"
version = "0.3.0"
description = "Evidence-aware geometric human reconstruction research laboratory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
 "numpy>=1.24", "scipy>=1.10", "scikit-image>=0.21", "opencv-python-headless>=4.7", "trimesh>=4.0", "Pillow>=10"
]

[project.optional-dependencies]
demo = ["plotly>=5.0", "matplotlib>=3.6"]
test = ["pytest>=7.0"]
vision = ["torch>=2.2", "transformers>=4.57"]

[project.scripts]
metric-human = "metric_human.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

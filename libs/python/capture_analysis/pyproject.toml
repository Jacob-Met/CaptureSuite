[project]
name = "capture-analysis"
version = "0.1.0"
description = "CaptureSuite offline analysis (processing/ jobs)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "capture-session",
  "capture-protocol",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
analysis = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14.0",
  "matplotlib>=3.8",
]
analysis-pose = [
  "capture-analysis[analysis]",
  "mediapipe>=0.10",
  "opencv-python-headless>=4.8",
  "av>=12.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["capture_analysis*"]

syntax = "proto3";

package capture.v1;

option csharp_namespace = "Capture.V1";
option java_package = "com.capturesuite.v1";

// Wire protocol major/minor for Hello handshake. Package is capture.v1.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message VersionInfo {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
  string git_describe = 4;
}

message ErrorInfo {
  string code = 1;       // e.g. INVALID_STATE, PROTOCOL_MISMATCH
  string message = 2;
  map<string, string> details = 3;
}

// Canonical timing header embedded by every data schema.
// See docs/design/TIMING.md
message TimingHeader {
  int64 sequence_number = 1;
  int64 device_index = 2;
  int64 device_timestamp = 3;
  string device_timestamp_unit = 4;
  sint64 host_arrival_ns = 5;
  sint64 session_time_ns = 6;
  int64 timestamp_uncertainty_ns = 7;
  string clock_mapping_id = 8;
  uint32 quality_flags = 9;
}

enum QualityFlag {
  QUALITY_FLAG_UNSPECIFIED = 0;
  QUALITY_FLAG_CLOCK_UNMAPPED = 1;
  QUALITY_FLAG_SEQUENCE_DISCONTINUITY = 2;
  QUALITY_FLAG_DEVICE_REPORTED_ERROR = 4;
  QUALITY_FLAG_INTERPOLATED_TIMESTAMP = 8;
  QUALITY_FLAG_AFTER_RECONNECT = 16;
  QUALITY_FLAG_SATURATED = 32;
}

// Framing MessageType — values used in the 16-byte CSP1 header.
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;

  MESSAGE_TYPE_HELLO = 1;
  MESSAGE_TYPE_HELLO_ACK = 2;

  MESSAGE_TYPE_IDENTIFY = 10;
  MESSAGE_TYPE_IDENTIFY_REPLY = 11;
  MESSAGE_TYPE_DISCOVER = 12;
  MESSAGE_TYPE_DISCOVER_REPLY = 13;
  MESSAGE_TYPE_CONNECT = 14;
  MESSAGE_TYPE_CONNECT_REPLY = 15;
  MESSAGE_TYPE_DISCONNECT = 16;
  MESSAGE_TYPE_DISCONNECT_REPLY = 17;
  MESSAGE_TYPE_SHUTDOWN = 18;
  MESSAGE_TYPE_SHUTDOWN_REPLY = 19;

  MESSAGE_TYPE_PAIR = 20;
  MESSAGE_TYPE_PAIR_REPLY = 21;
  MESSAGE_TYPE_UNPAIR = 22;
  MESSAGE_TYPE_UNPAIR_REPLY = 23;
  MESSAGE_TYPE_CALIBRATE = 24;
  MESSAGE_TYPE_CALIBRATE_REPLY = 25;

  MESSAGE_TYPE_GET_CAPABILITIES = 30;
  MESSAGE_TYPE_GET_CAPABILITIES_REPLY = 31;

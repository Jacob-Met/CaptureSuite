enum WorkerOperation {
  WORKER_OPERATION_UNSPECIFIED = 0;
  WORKER_OPERATION_PAIR = 1;
  WORKER_OPERATION_CALIBRATE = 2;
  WORKER_OPERATION_ARM = 4;
  WORKER_OPERATION_RECOVER = 8;
  WORKER_OPERATION_PREVIEW = 16;
}

message Hello {
  ProtocolVersion protocol = 1;
  VersionInfo component = 2;
  // Worker-only fields (empty for UI clients)
  string plugin_id = 3;
  string plugin_version = 4;
  ProtocolVersion min_daemon_protocol = 5;
  ProtocolVersion max_daemon_protocol = 6;
  uint32 supported_operations = 7;  // bitmask of WorkerOperation
  string worker_id = 8;
  string role = 9;  // "ui" | "worker" | "daemon"
}

message HelloAck {
  bool accepted = 1;
  ProtocolVersion negotiated = 2;
  VersionInfo daemon = 3;
  ErrorInfo error = 4;
  string instance_id = 5;
}

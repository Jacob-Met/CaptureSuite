  MESSAGE_TYPE_START_ALL_READY_REPLY = 113;
  MESSAGE_TYPE_REQUEST_STOP = 114;
  MESSAGE_TYPE_REQUEST_STOP_REPLY = 115;
  MESSAGE_TYPE_STOP_SESSION = 116;
  MESSAGE_TYPE_STOP_SESSION_REPLY = 117;
  MESSAGE_TYPE_CREATE_CHECKPOINT = 118;
  MESSAGE_TYPE_CREATE_CHECKPOINT_REPLY = 119;
  MESSAGE_TYPE_UPDATE_CHECKPOINT = 120;
  MESSAGE_TYPE_UPDATE_CHECKPOINT_REPLY = 121;
  MESSAGE_TYPE_ANNOTATE = 122;
  MESSAGE_TYPE_ANNOTATE_REPLY = 123;
  MESSAGE_TYPE_ADD_SYNC_ANCHOR = 124;

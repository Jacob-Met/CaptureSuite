  MESSAGE_TYPE_GET_CONFIG_SCHEMA_REPLY = 33;
  MESSAGE_TYPE_APPLY_CONFIG = 34;
  MESSAGE_TYPE_APPLY_CONFIG_REPLY = 35;
  MESSAGE_TYPE_VALIDATE = 36;
  MESSAGE_TYPE_VALIDATE_REPLY = 37;

  MESSAGE_TYPE_ARM = 40;
  MESSAGE_TYPE_ARM_REPLY = 41;
  MESSAGE_TYPE_START = 42;
  MESSAGE_TYPE_START_REPLY = 43;
  MESSAGE_TYPE_STOP = 44;
  MESSAGE_TYPE_STOP_REPLY = 45;
  MESSAGE_TYPE_RECOVER = 46;
  MESSAGE_TYPE_RECOVER_REPLY = 47;

  MESSAGE_TYPE_GET_STREAM_DESCRIPTORS = 50;
  MESSAGE_TYPE_GET_STREAM_DESCRIPTORS_REPLY = 51;
  MESSAGE_TYPE_GET_HEALTH = 52;
  MESSAGE_TYPE_GET_HEALTH_REPLY = 53;
  MESSAGE_TYPE_GET_PREVIEW_DESCRIPTOR = 54;
  MESSAGE_TYPE_GET_PREVIEW_DESCRIPTOR_REPLY = 55;

  MESSAGE_TYPE_CREATE_SESSION = 100;
  MESSAGE_TYPE_CREATE_SESSION_REPLY = 101;
  MESSAGE_TYPE_OPEN_SESSION = 102;
  MESSAGE_TYPE_OPEN_SESSION_REPLY = 103;
  MESSAGE_TYPE_FINALIZE_SESSION = 104;
  MESSAGE_TYPE_FINALIZE_SESSION_REPLY = 105;
  MESSAGE_TYPE_LIST_SOURCES = 106;
  MESSAGE_TYPE_LIST_SOURCES_REPLY = 107;
  MESSAGE_TYPE_SELECT_SOURCES = 108;
  MESSAGE_TYPE_SELECT_SOURCES_REPLY = 109;
  MESSAGE_TYPE_START_SELECTED = 110;
  MESSAGE_TYPE_START_SELECTED_REPLY = 111;

  MESSAGE_TYPE_INJECT_FAULT_REPLY = 137;
  MESSAGE_TYPE_LIST_PREVIEW_DESCRIPTORS = 138;
  MESSAGE_TYPE_LIST_PREVIEW_DESCRIPTORS_REPLY = 139;
  MESSAGE_TYPE_SET_PREVIEW_CONFIG = 140;
